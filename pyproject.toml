[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pythongpt-backend"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "openai==3.8.0",
    "websockets==17.1",
    "httptools==0.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
